name: Build Dilaxy Tweaks APK

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Ambil source code
        uses: actions/checkout@v4

      - name: Extract project.zip
        run: unzip -o project.zip -d .

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Download dan pasang Gradle 8.4
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.4-bin.zip
          unzip -q gradle-8.4-bin.zip -d $HOME
          echo "$HOME/gradle-8.4/bin" >> $GITHUB_PATH

      - name: Build APK debug
        run: gradle assembleDebug --no-daemon

      - name: Upload hasil APK
        uses: actions/upload-artifact@v4
        with:
          name: DilaxyTweaks-apk
          path: app/build/outputs/apk/debug/app-debug.apk
